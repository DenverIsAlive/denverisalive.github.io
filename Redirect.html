
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening App...</title>
<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
}
a {
    color: #00d4ff;
}
</style>
</head>
<body>

<div>
    <h3>Opening App...</h3>
    <p id="status">Please wait.</p>
    <a id="openLink" href="#" style="display:none">Tap here to open</a>
</div>

<script>
(function () {
    const params = new URLSearchParams(location.search);
    const streamUrl = params.get('url');
    const packageName = params.get('package') || 'com.ns.player';
    const status = document.getElementById('status');
    const link = document.getElementById('openLink');

    if (!streamUrl) {
        status.textContent = 'Missing URL parameter.';
        return;
    }

    try {
        const parsed = new URL(streamUrl);

        if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') {
            throw new Error('Invalid URL');
        }

        if (!/^[a-zA-Z0-9_]+(\.[a-zA-Z0-9_]+)+$/.test(packageName)) {
            throw new Error('Invalid package name');
        }

        const intentUrl =
            'intent://' + streamUrl.replace(/^https?:\/\//i, '') +
            '#Intent;scheme=' + parsed.protocol.slice(0, -1) +
            ';package=' + packageName + ';end';

        link.href = intentUrl;
        link.style.display = 'inline';
        link.textContent = 'Open in App';

        status.textContent = 'Redirecting...';

        location.href = intentUrl;

    } catch (error) {
        status.textContent = 'Invalid URL or package name.';
    }
})();
</script>

</body>
</html>
