
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101114;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 400px;
    padding: 25px;
    text-align: center;
    background: #1c1d22;
    border-radius: 15px;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #1685ff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

#status {
    color: #bbb;
    font-size: 14px;
    margin: 15px 0;
}

</style>
</head>

<body>

<div class="container">
    <h2>Opening App</h2>
    <p id="status">Preparing your link...</p>
    <button id="openBtn" style="display:none">
        Open in App
    </button>
</div>

<script>
(function () {

    const params = new URLSearchParams(window.location.search);

    const streamUrl = params.get('url');
    const packageName = params.get('package') || 'com.ns.player';

    const status = document.getElementById('status');
    const button = document.getElementById('openBtn');

    if (!streamUrl) {
        status.textContent = 'Error: URL parameter is missing.';
        return;
    }

    try {

        const parsedUrl = new URL(streamUrl);

        if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
            throw new Error('Invalid URL protocol');
        }

        if (!/^[a-zA-Z0-9_]+(\.[a-zA-Z0-9_]+)+$/.test(packageName)) {
            throw new Error('Invalid package name');
        }

        // Convert URL into Android Intent format.
        // URLSearchParams already decodes the incoming URL once.
        const intentUrl =
            'intent://' +
            streamUrl.replace(/^https?:\/\//i, '') +
            '#Intent;scheme=' +
            parsedUrl.protocol.replace(':', '') +
            ';package=' +
            packageName +
            ';end';

        status.textContent = 'Redirecting to app...';

        button.style.display = 'block';

        button.onclick = function () {
            window.location.href = intentUrl;
        };

        // Automatic redirect
        window.location.href = intentUrl;

    } catch (error) {

        status.textContent = 'Error: ' + error.message;

    }

})();
</script>

</body>
</html>
